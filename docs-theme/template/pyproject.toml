[project]
name = "docs-theme-sample"
version = "0.1.0"
description = "Zensical-style docs page built with Python-Markdown and Jinja."
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "markdown>=3.11.3",
    "pygments>=2.21.0",
    "pymdown-extensions>=13.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
