<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Terminal Color Palette</title></head>
<body style="background:#222; color:#fff; font-family:sans-serif">
<h2>Material Darker (Windows Terminal)</h2>
<div style="display:grid; grid-template-columns:repeat(8,80px); gap:8px;">
  <div style="background:#000000;width:80px;height:40px;">Black</div>
  <div style="background:#F07178;width:80px;height:40px;">Red</div>
  <div style="background:#C3E88D;width:80px;height:40px;">Green</div>
  <div style="background:#FFCB6B;width:80px;height:40px;">Yellow</div>
  <div style="background:#82AAFF;width:80px;height:40px;">Blue</div>
  <div style="background:#C792EA;width:80px;height:40px;">Magenta</div>
  <div style="background:#89DDFF;width:80px;height:40px;">Cyan</div>
  <div style="background:#FFFFFF;width:80px;height:40px;color:#000;">White</div>
  <div style="background:#545454;width:80px;height:40px;">BrightBlack</div>
  <div style="background:#F07178;width:80px;height:40px;">BrightRed</div>
  <div style="background:#C3E88D;width:80px;height:40px;">BrightGreen</div>
  <div style="background:#FFCB6B;width:80px;height:40px;">BrightYellow</div>
  <div style="background:#82AAFF;width:80px;height:40px;">BrightBlue</div>
  <div style="background:#C792EA;width:80px;height:40px;">BrightMagenta</div>
  <div style="background:#89DDFF;width:80px;height:40px;">BrightCyan</div>
  <div style="background:#FFFFFF;width:80px;height:40px;color:#000;">BrightWhite</div>
</div>
<br>
<div style="background:#212121;width:240px;height:40px;margin-top:16px;">Background #212121</div>
<div style="background:#EEFFFF;color:#000;width:240px;height:40px;margin-top:4px;">Foreground #EEFFFF</div>
</body>
</html>
